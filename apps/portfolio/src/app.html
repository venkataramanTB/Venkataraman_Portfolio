<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/logo.png" />
		<meta name="theme-color" content="#2261e9" />

		<!--
			Inter is the fallback face for everything that is not an Apple
			platform; on Apple hardware the system face wins in the CSS stack and
			these files are never used for body copy. Only the weights the type
			scale actually names are requested.
		-->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<!--
			Funnel Display for the big headings, Space Grotesk for everything
			else. Two families doing two clearly separate jobs — a display face
			that only ever appears large, and a text face tuned for small sizes.
		-->
		<link
			href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@300..800&family=Space+Grotesk:wght@300..700&display=swap"
			rel="stylesheet"
		/>

		<!--
			Substrate bootstrap. Runs synchronously before first paint so a pinned
			dark theme never flashes the light substrate first. Deliberately tiny
			and dependency-free; the real logic lives in $lib/theme.js.
		-->
		<script>
			(function () {
				try {
					var m = localStorage.getItem('vtb-theme');
					if (m === 'light' || m === 'dark') {
						document.documentElement.setAttribute('data-theme', m);
					}
					var dark =
						m === 'dark' ||
						(m !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
					if (dark) {
						var t = document.querySelector('meta[name="theme-color"]');
						if (t) t.setAttribute('content', '#0b0b0c');
					}
				} catch (e) {
					/* blocked storage: fall back to the system preference in CSS */
				}
			})();
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<a href="#main" class="skip-link">Skip to content</a>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
