<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#f4f4f0" />
    <script>
      (function () {
        try {
          var m = localStorage.getItem('vtb-admin-theme');
          if (m === 'light' || m === 'dark') {
            document.documentElement.setAttribute('data-theme', m);
          }
          var dark = m === 'dark' || (m !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            var t = document.querySelector('meta[name="theme-color"]');
            if (t) t.setAttribute('content', '#0a0a0a');
          }
        } catch (e) {}
      })();
    </script>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="bg-paper text-ink antialiased">
    <div id="svelte">%sveltekit.body%</div>
  </body>
</html>
